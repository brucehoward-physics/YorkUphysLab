[build-system]
requires = ['setuptools>=42']
build-backend = 'setuptools.build_meta'

[project]
name = "YorkUphysLabV2"
version = "2.0.0"
authors = [
  { name="Bruce Howard (maintainer)", email="blhoward@yorku.ca" },
  { name="Mohammad Kareem (original author)", email="mkareem@yorku.ca" },
]
description = "A Python package to control YU physics labs equipment. V2 updated to work with new versions of setup."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
	"Programming Language :: Python :: 3",
	"Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "nidaqmx",
  "pyserial",
  "pyvisa-py",
  "numpy",
]

[project.urls]
Homepage = "https://github.com/brucehoward-physics/YorkUphysLab"
Issues = "https://github.com/m-kareem/YorkUphysLab/issues"

[tool.setuptools.packages]
find = {} # Copied from the YorkUphysLab setup.cfg
